version: '3.8'
services:
  rasa:
    image: rasa/rasa:latest
    ports:
      - "5005:5005"
    volumes:
      - ./rasa:/app
      - railway_rasa_volume:/app/data
    command:
      - run
      - -m
      - models
      - --enable-api
      - --cors
      - "*"
      - --debug

  action_server:
    image: rasa/rasa-sdk:latest
    ports:
      - "5055:5055"
    volumes:
      - ./actions:/app/actions

volumes:
  railway_rasa_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RAILWAY_VOLUME_PATH}
